# Two-wavelength (852 / 1064 nm) meta-atom screen: C4v rings and two-pillar cells.
# Reduced numerics for a screen (121 Fourier terms, 128 grid; checked against 197 / 256 on a
# subset at the start of the run, convergence.json).
run_id: dual_library
output_dir: data/dual_library
materials: [sin_si_rich, sin_lpcvd]
substrate: fused_silica
wavelengths_um: [0.852, 1.0644]
pitch_um: [0.55]                     # 0.50 dropped for run time (one ring file at 0.50 kept)
height_um: [1.6, 2.0, 2.4]
families:
  ring: {step_um: 0.02}
  duo: {step_um: 0.02}
rules: {min_feature_um: 0.10, max_aspect: 15.0}    # superset; analysis also applies max_aspect 10
n_terms: 121
n_grid: 128
batch: 24
convergence: {n_atoms: 6, n_terms: 197, n_grid: 256}
