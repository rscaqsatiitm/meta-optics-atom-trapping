# Fold-window check of the v2 design (20,164 sites, array in the lens focal plane): 2.048 mm (as in
# results/fullaperture_v2) against 9.216 mm, same tiled pipeline. Review 3, finding 1.
# Run: python scripts/fold_window_study.py configs/fold_window_v2.yaml
run_id: fold_window_v2
wavelength_um: 1.075
na: 0.55
stack:
- [2500, air]
- [4000, fused_silica]
- [9000, air]
illumination: {kind: top_hat}
pixel_um: 0.5
site_pitch_um: 4.0
sites: {kind: square, nx: 142, ny: 142, pitch_um: 4.0}
pupil_guard: 1.25
render_upsample: 8
upsample: 4
block_rows: 64
library: {path: data/library_est_1075.h5, material: sin_si_rich_est, pitch_um: 0.5, height_um: 1.6}
array_defocus_um: 0.0
metrics_tile_px: 1024
n_folds: [4096, 18432]
cases:
- {name: v2_ideal, state: data/designs/fullaperture_v2_state.npz, pillars: ideal}
- {name: v2_library, state: data/designs/fullaperture_v2_state.npz, pillars: library}
- name: v2_library_sigma5nm
  state: data/designs/fullaperture_v2_state.npz
  pillars: library
  errors: {sigma_um: 0.005, seed: 1}
