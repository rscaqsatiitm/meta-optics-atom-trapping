# Meta-atom library for the static meta-hologram (1075 nm) and the side-B wavelengths.
# Numerics from results/rcwa_convergence: Jones-direct-Fourier, 197 terms, 256 grid;
# relative-phase uncertainty ~0.01 rad (up to ~0.03 rad for gaps below ~60 nm).
run_id: library_main
output: data/library_main.h5
materials: [sin_lpcvd, sin_si_rich]
substrate: fused_silica
shape: square
pitch_um: [0.40, 0.45, 0.50, 0.55, 0.60]
height_um: {min: 0.8, max: 2.0, step: 0.1}
wavelength_um: [1.075, 1.0644, 0.895, 0.852]
width_frac: {min: 0.12, max: 0.90, n: 40}
n_terms: 197
n_grid: 256
formulation: jones_direct_fourier
