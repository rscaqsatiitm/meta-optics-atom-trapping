# Unfolded reference for configs/fold_window_100k.yaml: the whole 36,864^2 metasurface grid
# (W = 18.432 mm, no folding) propagated in place, same cases and metrics.
# Run: python scripts/fold_window_study.py configs/fold_window_100k_full.yaml   (peak ~12 GB)
