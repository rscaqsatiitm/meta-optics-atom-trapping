# One-million-site study: meta-objective field versus focal length and NA, lenslet-array
# architecture, and hologram scaling.
run_id: million
objective_scan:
  wavelength_um: 0.8523
  na: [0.5, 0.6, 0.7]
  air_gap_um: [2500, 10000, 25000, 50000]   # focusing plate to cell wall; sets f
  ext: 1.6                                  # aplanat construction radius / R1 (covers R2 + field)
  cell_rest: [[4000, fused_silica], [9000, air]]
  spacing_fracs: [0.96, 0.98, 1.0, 1.02]
imaging:
  wavelength_um: 0.8523
  na: 0.5
  pitch_um: 4.0
  ext: 1.6
  n_pupil: 220
  n_grid: 81
  field_um: [0, 1000, 1770, 2121, 2828]   # 1e6 sites: corner 1.77 mm (2.5 um pitch), 2.12 mm (3 um), 2.83 mm (4 um)
  corrected_field_um: [1770, 2121, 2828]
  designs:
    - {name: f16, air_gap_um: 2500}
    - {name: f25, air_gap_um: 10000}
    - {name: f42, air_gap_um: 25000}
mla:
  wavelength_um: 1.075
  na: 0.5
  pitch_um: [3.0, 4.0]
  demag: [5, 10, 20]
  field_um: [0, 1000, 1770, 2121, 2828]
  objectives:
    - {name: f16, air_gap_um: 2500}
    - {name: f25, air_gap_um: 10000}
  wavecheck_field_um: [2828]
tolerances_f42:
  air_gap_um: 25000
  heights_um: [-2828, 0, 2828]
  cases:
    - {name: nominal}
    - {name: spacer +50um, spacer_delta_um: 50}
    - {name: spacer +200um, spacer_delta_um: 200}
    - {name: wall +50um, wall_delta_um: 50}
    - {name: decentre 2um, m2_decentre_um: 2}
    - {name: decentre 5um, m2_decentre_um: 5}
    - {name: decentre 10um, m2_decentre_um: 10}
    - {name: cell tilt 0.05deg, cell_tilt_rad: 0.00087266}
    - {name: cell tilt 0.1deg, cell_tilt_rad: 0.0017453}
patch:
  wavelength_um: 1.075
  na: 0.5
  pitch_um: 4.0
  air_gap_um: 10000          # 25 mm trapping objective
  centres_um: [0, 2828]
  pistons: [equal, alternating, random]
  n_pupil: 150
