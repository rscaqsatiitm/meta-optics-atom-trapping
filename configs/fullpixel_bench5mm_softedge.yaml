# Full-pixel validation, 5 mm aperture at NA 0.5 through a 1 mm fused-silica plate, with a
# raised-cosine illumination edge over 10 % of the radius (suppresses the edge-generated
# zero order found in results/fullpixel_bench5mm), and two rounds of model-in-the-loop
# feedback on the exact design.
run_id: fullpixel_bench5mm_softedge
wavelength_um: 1.075
na: 0.5
stack: [[1000, air], [1000, fused_silica], [2693, air]]
illumination: {kind: top_hat, edge_um: 250.0}
pixel_um: 0.5
site_pitch_um: 4.5
sites: {kind: square, nx: 48, ny: 48, pitch_um: 4.5}
pupil_oversample: 4
pupil_guard: 1.6
wgs_iter: 60
wgs_fix: 30
upsample: 4
render_upsample: 8
feedback_rounds: 2
feedback_gain: 0.5
feedback_wgs_iter: 30
