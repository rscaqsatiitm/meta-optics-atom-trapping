# Pupil-phase feedback of the 10^5-site design redone on the UNFOLDED metasurface grid (review 3,
# findings 1 and 2). The earlier rounds (fullaperture_100k_pp/_pplib/_pplib_g08) measured the
# sites in a 2.048 mm fold window, which aliased stray light and design noise back onto the array;
# the loop corrected the alias pattern (in-sample 0.45 %, 6.7 % out of sample at 4.6 to 9.2 mm,
# results/fold_window_100k). Here n_fold equals the metasurface size (36,864^2, 18.4 mm period,
# complex64, ~11 GB, propagated in place), so nothing within the aperture footprint is aliased.
# Starts from the round-17 design, library pillars in the loop, gain 1.0, rounds 18 to 26; then
# three seeds of 5 nm width noise and the correlated-error cases of configs/checks_v2.yaml.
# Run: python scripts/fullaperture_lazy.py configs/fullaperture_100k_full.yaml --tiled
run_id: fullaperture_100k_full
wavelength_um: 1.075
na: 0.55
stack:
- [2500, air]
- [4000, fused_silica]
- [9000, air]
illumination: {kind: top_hat}
pixel_um: 0.5
site_pitch_um: 4.0
sites: {kind: square, nx: 316, ny: 316, pitch_um: 4.0}
pupil_guard: 1.25
wgs_iter: 60
wgs_fix: 30
render_upsample: 5
n_fold: 36864
upsample: 4
feedback_rounds: 26
array_defocus_um: 50.0
block_rows: 64
feedback_gain: 1.0
feedback_wgs_iter: 30
library: {path: data/library_est_1075.h5, material: sin_si_rich_est, pitch_um: 0.5, height_um: 1.6}
pillar_cases:
- {name: library_lpa}
- name: library_sigma5nm
  errors: {sigma_um: 0.005, seed: 1}
- name: library_sigma5nm_seed2
  errors: {sigma_um: 0.005, seed: 2}
- name: library_sigma5nm_seed3
  errors: {sigma_um: 0.005, seed: 3}
- name: library_smooth5nm_L50um
  errors: {corr_sigma_um: 0.005, corr_length_um: 50.0, seed: 15}
- name: library_combined
  errors: {field_um: 100.0, stitch_sigma_um: 0.02, field_bias_sigma_um: 0.002, corr_sigma_um: 0.003, corr_length_um: 5.0, sigma_um: 0.003, seed: 16}
power_budget:
  core_fraction_ideal: 0.783
  na_eff: 0.574
  powers_W: [50, 100]
  extra_factors: {edge_vs_lpa: 0.879, substrate_entrance_ar: 0.995, cell_wall_ar: 0.99, beam_shaper: 0.95, vector_peak: 0.917}
metrics_tile_px: 1024
initial_state: data/designs/fullaperture_100k_pplib_round17_state.npz
feedback_mode: pupil_phase
feedback_pillars: library
fold_dtype: complex64
