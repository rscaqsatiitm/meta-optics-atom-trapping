# Damage and power limits for the 18.4 mm in-cell metasurface (NA 0.55, top hat, 1075 nm).
run_id: damage_v2
wavelength_um: 1.075
na: 0.55
stack: [[2500, air], [4000, fused_silica], [9000, air]]   # [CONFIRM?]
die_radius_mm: 12.5
rim: fixed
reference_power_W: 100
powers_W: [50, 100, 150, 200, 300]
limits:
  stress_safety_factor: 7      # on the mean strength (Weibull modulus 4-5 for glass); assumption
  dT_K: 50                     # mount adhesive / film stability; assumption
  focal_shift_um: 1.0          # error budget
  defect_dT_K: 50              # local rise allowed at an absorbing defect; assumption
films:
  si_rich_pecvd: {biaxial_modulus_GPa: 125, nu: 0.25, alpha: 2.6e-6}   # biaxial modulus and CTE (300 C deposition) from search snippets; nu [VALUE?]
  lpcvd: {biaxial_modulus_GPa: 356, nu: 0.27, alpha: 3.3e-6}           # E 260 GPa (MRS 2001) / (1 - nu); nu and alpha [VALUE?]
tpa: {beta_cm_per_GW: 1.5, enhancement: 20, alpha_linear_per_cm: 8.0}   # bulk-Si beta at 1.06 um as an upper bound; enhancement assumed
cases:
  - {name: fs0.5_sirich_nominal, substrate: fused_silica, thickness_mm: 0.5, film: si_rich_pecvd, a_film: 5.9e-4}
  - {name: fs0.5_sirich_upper, substrate: fused_silica, thickness_mm: 0.5, film: si_rich_pecvd, a_film: 2.7e-3}
  - {name: fs0.5_lpcvd, substrate: fused_silica, thickness_mm: 0.5, film: lpcvd, a_film: 3.5e-6}
  - {name: fs0.5_sirich_nominal_bulk10ppm, substrate: fused_silica, thickness_mm: 0.5, film: si_rich_pecvd, a_film: 5.9e-4, alpha_bulk_per_m: 1.0e-3}
  - {name: fs1.0_sirich_upper, substrate: fused_silica, thickness_mm: 1.0, film: si_rich_pecvd, a_film: 2.7e-3}
  - {name: sapphire0.5_sirich_nominal, substrate: sapphire, thickness_mm: 0.5, film: si_rich_pecvd, a_film: 5.9e-4}
  - {name: sapphire0.5_sirich_upper, substrate: sapphire, thickness_mm: 0.5, film: si_rich_pecvd, a_film: 2.7e-3}
  - {name: sapphire0.5_sirich_upper_bulk30ppm, substrate: sapphire, thickness_mm: 0.5, film: si_rich_pecvd, a_film: 2.7e-3, alpha_bulk_per_m: 3.0e-3}
