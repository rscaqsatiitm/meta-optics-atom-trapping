# Review 4, objection 3: correlated (smooth) pillar-width errors on the final 10^5-site design (round 26),
# unfolded 36,864^2 grid. Seed 15 at 5 nm / 50 um was run in results/fullaperture_100k_full
# (library_smooth5nm_L50um: 5.54 %); here two more seeds, half the amplitude, and lengths 20 and 200 um.
# Run: python scripts/fold_window_study.py configs/corr_errors_100k.yaml   (peak ~12 GB)
run_id: corr_errors_100k
wavelength_um: 1.075
na: 0.55
stack:
- [2500, air]
- [4000, fused_silica]
- [9000, air]
illumination: {kind: top_hat}
pixel_um: 0.5
site_pitch_um: 4.0
sites: {kind: square, nx: 316, ny: 316, pitch_um: 4.0}
pupil_guard: 1.25
render_upsample: 5
upsample: 4
array_defocus_um: 50.0
block_rows: 64
library: {path: data/library_est_1075.h5, material: sin_si_rich_est, pitch_um: 0.5, height_um: 1.6}
metrics_tile_px: 1024
n_folds: [36864]
cases:
- name: smooth5nm_L50um_seed16
  state: data/designs/fullaperture_100k_full_round26_state.npz
  pillars: library
  errors: {corr_sigma_um: 0.005, corr_length_um: 50.0, seed: 16}
- name: smooth5nm_L50um_seed17
  state: data/designs/fullaperture_100k_full_round26_state.npz
  pillars: library
  errors: {corr_sigma_um: 0.005, corr_length_um: 50.0, seed: 17}
- name: smooth2p5nm_L50um_seed15
  state: data/designs/fullaperture_100k_full_round26_state.npz
  pillars: library
  errors: {corr_sigma_um: 0.0025, corr_length_um: 50.0, seed: 15}
- name: smooth5nm_L20um_seed15
  state: data/designs/fullaperture_100k_full_round26_state.npz
  pillars: library
  errors: {corr_sigma_um: 0.005, corr_length_um: 20.0, seed: 15}
- name: smooth5nm_L200um_seed15
  state: data/designs/fullaperture_100k_full_round26_state.npz
  pillars: library
  errors: {corr_sigma_um: 0.005, corr_length_um: 200.0, seed: 15}
