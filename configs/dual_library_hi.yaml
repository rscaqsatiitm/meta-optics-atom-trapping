# Two-wavelength (852 / 1064 nm) screen for other films: ALD TiO2 on fused silica, GaN on
# sapphire and crystalline Si on sapphire. Same families, rules and numerics as dual_library.
# Pitch on sapphire is 0.45 um: below lambda / n_sapphire = 0.484 um at 852 nm (no diffraction
# into the substrate at normal incidence).
run_id: dual_library_hi
output_dir: data/dual_library
wavelengths_um: [0.852, 1.0644]
materials:
  - {name: tio2_ald, substrate: fused_silica, pitch_um: [0.55], height_um: [1.6, 2.0]}       # [CONFIRM?: achievable ALD TiO2 height]
  - {name: gan_o, substrate: sapphire_o, pitch_um: [0.45], height_um: [1.6, 2.0]}           # birefringence neglected
  # crystalline Si: see configs/dual_library_si.yaml (full numerics; 121 terms not converged at n = 3.6)
families:
  ring: {step_um: 0.02}
  duo: {step_um: 0.02}
rules: {min_feature_um: 0.10, max_aspect: 15.0}
n_terms: 121
n_grid: 128
batch: 24
convergence: {n_atoms: 6, n_terms: 197, n_grid: 256}
