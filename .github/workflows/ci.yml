# Tests and the report-number check on every push and pull request.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Report numbers (LaTeX edition against Markdown source, explicit allowlist)
        run: python scripts/check_report_numbers.py
      - name: Tests
        run: python -m pytest -q
